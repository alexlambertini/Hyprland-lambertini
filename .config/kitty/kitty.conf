# Kitty - tema alinhado ao Waybar/Hyprland

# Fonte
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Cores (tema)
foreground            #cccccc
background            #1e1e2e
selection_foreground  #1e1e2e
selection_background  #df6124
cursor                #df6124
cursor_text_color     #1e1e2e
url_color             #df6124

# Paleta
color0  #1e1e2e
color1  #eb7087
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #df6124
color6  #94e2d5
color7  #cccccc
color8  #4b4e55
color9  #f38ba8
color10 #b1f0ab
color11 #ffe8b0
color12 #a6c8ff
color13 #ff8a4c
color14 #b0f2e6
color15 #f5f5f5

# Janela e transparência
background_opacity         0.92
dynamic_background_opacity yes
window_padding_width       10
confirm_os_window_close    0
hide_window_decorations    yes

# Cursor (animações/frescurinhas)
cursor_shape               beam
cursor_blink_interval      0.5
cursor_stop_blinking_after 15.0
cursor_trail               1

# Scrollback e comportamento
scrollback_lines 10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0
copy_on_select          clipboard
strip_trailing_spaces   smart

# URLs
detect_urls yes
open_url_with default
underline_hyperlinks hover

# Barra de abas
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #1e1e2e
active_tab_background   #df6124
inactive_tab_foreground #cccccc
inactive_tab_background #252536
tab_bar_background      #1e1e2e

# Bell
enable_audio_bell    no
visual_bell_duration 0.0

# Performance/renderização
repaint_delay 8
input_delay   2
sync_to_monitor yes

# Shell integration
shell_integration enabled
