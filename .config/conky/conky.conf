conky.config = {
    -- Saída (XWayland para janela arrastável/visível)
    out_to_wayland = true,
    out_to_x = false,

    -- Janela
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 150,
    own_window_colour = '#1e1e2e',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_class = 'conky-monitor',

    -- Posição e tamanho
    alignment = 'top_right',
    gap_x = 20,
    gap_y = 0,
    minimum_width = 340,
    maximum_width = 340,

    -- Aparência (tema Waybar)
    background = false,
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    border_inner_margin = 14,
    default_color = '#cccccc',
    color1 = '#df6124',  -- accent
    color2 = '#888888',  -- dim
    color3 = '#a6e3a1',  -- ok
    font = 'JetBrains Mono Nerd Font:size=10',
    font1 = 'JetBrains Mono Nerd Font:size=10:bold',
    font2 = 'JetBrains Mono Nerd Font:size=28:bold',
    font3 = 'JetBrains Mono Nerd Font:size=11',

    -- Atualização
    update_interval = 2.0,
    no_buffers = true,

    -- Texto
    use_xft = true,
    override_utf8_locale = true,
    short_units = true,
    format_human_readable = true,
};

conky.text = [[
${font2}${color1}${alignc}${time %H:%M}${font}${color}
${font3}${color2}${alignc}${time %A, %d de %B de %Y}${font}${color}

${font1}${color1}󰃭  CALENDÁRIO${font}${color}
${color2}${hr 1}${color}
${font JetBrains Mono Nerd Font:size=9}${execpi 3600 cal | sed '1d' | sed '/^ *$/d'}${font}

${font1}${color1}󰖐  CLIMA${font}${color}
${color2}${hr 1}${color}
${execpi 900 ~/.config/conky/weather-short.sh}

${font1}${color1}󰝚  TOCANDO AGORA${font}${color}
${color2}${hr 1}${color}
${execpi 5 ~/.config/conky/now-playing.sh}
]];
