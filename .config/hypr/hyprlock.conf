$font = JetBrains Mono Nerd Font

general {
    hide_cursor = true
    grace = 2
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.15
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    inner_color = rgba(30, 30, 46, 0.7)
    outer_color = rgba(223, 97, 36, 0.9) rgba(204, 204, 204, 0.4) 45deg
    check_color = rgba(166, 227, 161, 0.9)
    fail_color = rgba(235, 112, 135, 0.9)
    font_color = rgb(204, 204, 204)
    fade_on_empty = false
    rounding = 10
    font_family = $font
    placeholder_text = <span foreground="##ccccccaa">Senha...</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 84
    font_family = $font
    color = rgba(204, 204, 204, 1.0)
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B de %Y"
    font_size = 22
    font_family = $font
    color = rgba(204, 204, 204, 0.85)
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[br,us]
    font_size = 14
    font_family = $font
    color = rgba(204, 204, 204, 0.7)
    onclick = hyprctl switchxkblayout all next
    position = 0, -80
    halign = center
    valign = center
}
